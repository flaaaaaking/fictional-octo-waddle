services:
  - type: web
    name: bigfive-feedback-plan
    runtime: node
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/access/availability
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: DAILY_CODE_LIMIT
        value: "10"
      - key: MAX_TURNS_PER_SESSION
        value: "66"
      - key: SESSION_TTL_HOURS
        value: "87600"
      - key: SESSION_SECRET
        generateValue: true
      - key: DEEPSEEK_API_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
